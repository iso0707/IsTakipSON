name: APK Derle

# Ne zaman çalışsın:
#  - main/master'a her push'ta otomatik
#  - GitHub sayfasından "Run workflow" ile elle de tetiklenebilir
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Buildozer ile APK derle
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          # Her çalıştırmada temiz bir Ubuntu makinesi kullanılır,
          # bu yüzden eski/önbellek sorunu (fpdf2'nin pakete
          # girmemesi gibi) burada yaşanmaz.
          command: buildozer android debug
          buildozer_version: stable

      - name: APK'yı indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: istakip-apk
          path: ${{ steps.buildozer.outputs.filename }}
